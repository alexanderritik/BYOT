<title>BYOT Control Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#eaeeec; --border:rgba(19,28,23,0.11);
  --text:#121815; --text-muted:#5c6b64;
  --accent:#0f9d68; --accent-soft:rgba(15,157,104,0.12);
  --danger:#d6304a; --danger-soft:rgba(214,48,74,0.12);
  --warning:#b9740a; --warning-soft:rgba(185,116,10,0.12);
  --info:#2f6fa8; --info-soft:rgba(47,111,168,0.12);
  --sev-p1:#c1560f; --sev-p1-soft:rgba(193,86,15,0.12);
  --shadow:0 1px 2px rgba(20,30,26,0.06), 0 8px 24px rgba(20,30,26,0.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1310; --surface:#121a17; --surface-2:#19231f; --border:rgba(255,255,255,0.08);
    --text:#e8ece9; --text-muted:#8a9a92;
    --accent:#22e0a0; --accent-soft:rgba(34,224,160,0.14);
    --danger:#ff5c72; --danger-soft:rgba(255,92,114,0.14);
    --warning:#f5a623; --warning-soft:rgba(245,166,35,0.14);
    --info:#5b9dd9; --info-soft:rgba(91,157,217,0.14);
    --sev-p1:#ff8a3d; --sev-p1-soft:rgba(255,138,61,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1310; --surface:#121a17; --surface-2:#19231f; --border:rgba(255,255,255,0.08);
  --text:#e8ece9; --text-muted:#8a9a92;
  --accent:#22e0a0; --accent-soft:rgba(34,224,160,0.14);
  --danger:#ff5c72; --danger-soft:rgba(255,92,114,0.14);
  --warning:#f5a623; --warning-soft:rgba(245,166,35,0.14);
  --info:#5b9dd9; --info-soft:rgba(91,157,217,0.14);
  --sev-p1:#ff8a3d; --sev-p1-soft:rgba(255,138,61,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}

.app{display:flex;min-height:100vh;}

/* ---- rail ---- */
.rail{width:216px;flex-shrink:0;border-right:1px solid var(--border);padding:1.25rem 1rem;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:.55rem;margin-bottom:.25rem;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.brand-name{font-family:'JetBrains Mono';font-weight:700;font-size:.95rem;letter-spacing:-0.01em;}
.brand-tag{font-size:.68rem;color:var(--text-muted);margin:0 0 1.5rem 1.4rem;font-family:'JetBrains Mono';letter-spacing:.02em;}
.nav{display:flex;flex-direction:column;gap:.15rem;}
.nav-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .65rem;border-radius:6px;border:none;background:transparent;color:var(--text-muted);text-align:left;cursor:pointer;font-size:.85rem;font-weight:500;}
.nav-item svg{width:15px;height:15px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.rail-foot{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--text-muted);line-height:1.6;}
.rail-foot code{font-family:'JetBrains Mono';background:var(--surface-2);padding:.1rem .35rem;border-radius:4px;}

/* ---- main ---- */
.main{flex:1;min-width:0;padding:1.75rem 2.5rem 3rem;max-width:1180px;}
.crumbs{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text-muted);margin-bottom:.6rem;font-family:'JetBrains Mono';}
.crumbs button{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0;font-family:inherit;font-size:inherit;}
.crumbs button:hover{color:var(--accent);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--text);}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;margin:0 0 .2rem;text-wrap:balance;}
.sub{color:var(--text-muted);font-size:.86rem;margin:0 0 1.5rem;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}

/* ---- stat tiles ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.75rem;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;box-shadow:var(--shadow);}
.stat-n{font-family:'JetBrains Mono';font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-l{font-size:.74rem;color:var(--text-muted);margin-top:.15rem;}
.stat.ok .stat-n{color:var(--accent);} .stat.bad .stat-n{color:var(--danger);} .stat.warn .stat-n{color:var(--warning);}

/* ---- table ---- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:640px;}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--surface-2);}
td{padding:.7rem 1rem;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--surface-2);}
.tname{font-weight:600;}
.tid{color:var(--text-muted);font-size:.72rem;}

/* ---- badges / pills ---- */
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:100px;font-size:.72rem;font-weight:600;font-family:'JetBrains Mono';white-space:nowrap;}
.pill-p0{background:var(--danger-soft);color:var(--danger);}
.pill-p1{background:var(--sev-p1-soft);color:var(--sev-p1);}
.pill-p2{background:var(--warning-soft);color:var(--warning);}
.pill-p3{background:var(--info-soft);color:var(--info);}
.runtime-badge{display:inline-flex;align-items:center;padding:.2rem .5rem;border-radius:5px;font-size:.72rem;font-family:'JetBrains Mono';background:var(--surface-2);color:var(--text-muted);}
.status{display:inline-flex;align-items:center;gap:.45rem;font-weight:600;font-size:.82rem;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status.pass .status-dot{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.status.pass{color:var(--accent);}
.status.fail .status-dot{background:var(--danger);box-shadow:0 0 6px var(--danger);}
.status.fail{color:var(--danger);}
.status.pending .status-dot{background:var(--text-muted);}
.status.pending{color:var(--text-muted);}
.status.running .status-dot{background:var(--warning);animation:pulse 1.1s ease-in-out infinite;}
.status.running{color:var(--warning);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.bell{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--danger);background:var(--danger-soft);padding:.15rem .5rem;border-radius:100px;font-family:'JetBrains Mono';}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:7px;padding:.5rem .9rem;font-size:.82rem;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#04140d;}
.btn-accent:hover{filter:brightness(1.06);}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-sm{padding:.32rem .65rem;font-size:.75rem;}
.btn-danger{color:var(--danger);border-color:transparent;background:var(--danger-soft);}
.btn-danger:hover{filter:brightness(1.06);}
.btn-row{display:flex;gap:.35rem;justify-content:flex-end;flex-wrap:wrap;}
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,10,0.55);display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:1000;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-width:420px;width:100%;padding:1.35rem 1.5rem;}
.modal h2{margin:0 0 .5rem;font-size:1.1rem;}
.modal p{margin:0 0 1rem;color:var(--text-muted);font-size:.86rem;line-height:1.5;}
.modal .field{margin-bottom:1rem;}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;}
.btn-icon{min-width:5.5rem;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.02em;}
.btn-play.btn-accent{box-shadow:0 0 0 1px var(--accent-soft);}
.btn-stop.btn-danger{font-weight:700;}

/* ---- forms ---- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;max-width:720px;}
.field{display:flex;flex-direction:column;gap:.4rem;}
.field.full{grid-column:1/-1;}
.field label{font-size:.78rem;font-weight:600;color:var(--text);}
.field .hint{font-size:.72rem;color:var(--text-muted);}
.field input,.field select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:.55rem .7rem;font-size:.85rem;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.dropzone{border:1.5px dashed var(--border);border-radius:10px;padding:1.5rem;text-align:center;color:var(--text-muted);font-size:.82rem;background:var(--surface-2);}
.dropzone strong{color:var(--text);}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem;}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:100px;padding:.22rem .65rem;font-size:.7rem;font-family:'JetBrains Mono';cursor:pointer;}
.chip:hover{border-color:var(--accent);color:var(--accent);}

/* ---- key/value strip ---- */
.kv-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1.1rem;padding:1.1rem 1.25rem;}
.kv-strip div{display:flex;flex-direction:column;gap:.25rem;}
.kv-k{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
.kv-v{font-family:'JetBrains Mono';font-size:.86rem;word-break:break-all;}

/* ---- log terminal ---- */
.term{background:#0a0f0d;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.term-bar{display:flex;align-items:center;gap:.4rem;padding:.55rem .9rem;background:#111815;border-bottom:1px solid rgba(255,255,255,0.06);}
.term-bar span{font-size:.7rem;color:#6f8079;font-family:'JetBrains Mono';margin-left:.4rem;}
.term-dot{width:9px;height:9px;border-radius:50%;}
.term-body{padding:1rem 1.1rem;font-family:'JetBrains Mono';font-size:.78rem;line-height:1.9;max-height:420px;overflow:auto;}
.log-line{white-space:pre-wrap;word-break:break-word;}
.log-t{color:#5c6b64;}
.log-stdout{color:#c9d6d0;}
.log-stderr{color:#ff8a93;}

.section-title{font-size:.95rem;font-weight:700;margin:1.75rem 0 .75rem;}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--text-muted);font-size:.85rem;}

/* ---- toast ---- */
#toast-root{position:fixed;bottom:1.25rem;right:1.25rem;display:flex;flex-direction:column;gap:.5rem;z-index:50;}
.toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:9px;padding:.7rem 1rem;font-size:.8rem;max-width:320px;display:flex;align-items:flex-start;gap:.55rem;}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:.35rem;flex-shrink:0;}
</style>

<div id="toast-root"></div>
<div class="app">
  <div class="rail">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">BYO<span style="color:var(--accent)">T</span></span></div>
    <div class="brand-tag">live · connected to API</div>
    <div class="nav">
      <button class="nav-item active" data-nav="dashboard" onclick="go('dashboard')">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3" width="6" height="6" rx="1"/><rect x="11.5" y="3" width="6" height="6" rx="1"/><rect x="2.5" y="11" width="6" height="6" rx="1"/><rect x="11.5" y="11" width="6" height="6" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-nav="upload" onclick="go('upload')">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 13V4M10 4l-3 3M10 4l3 3"/><path d="M3.5 13.5v2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
        Upload test
      </button>
    </div>
    <div class="rail-foot">Server <code>:3000</code><br>Runtimes <code>go</code> · <code>node</code><br><span class="tid">▶ Play / ■ Stop = cron on/off</span></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
const state = { view: 'dashboard', testId: null, runId: null };
let testList = [];

function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shortId(id){ return (id||'').slice(0,8); }

async function apiJson(url, opts){
  const res = await fetch(url, opts);
  if (!res.ok){
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function statusPill(status){
  const label = {pass:'passing',fail:'failing',pending:'no runs yet',running:'running'}[status] || status;
  return `<span class="status ${status}"><span class="status-dot"></span>${label}</span>`;
}
function sevPill(sev){ return `<span class="pill pill-${(sev||'P2').toLowerCase()}">${esc(sev)}</span>`; }
function runtimeBadge(rt){ return `<span class="runtime-badge">${esc(rt)}</span>`; }

function lastStatus(item){
  return item.last_run ? item.last_run.status : 'pending';
}

function scheduleLabel(test){
  if (!test.schedule_cron) return 'manual only';
  return test.schedule_enabled ? `${test.schedule_cron} · on` : `${test.schedule_cron} · paused`;
}

function alertLabel(test){
  if (!test.webhook_url) return '—';
  if (test.alerts_enabled === false) return 'paused';
  const th = test.failure_threshold || 3;
  if (test.alert_active) return `<span class="status fail"><span class="status-dot"></span>firing</span>`;
  if (test.consecutive_failures > 0) return `${test.consecutive_failures} consecutive`;
  return 'webhook ✓';
}

function alertsConfiguredCount(){
  return testList.filter(x=>x.test.webhook_url).length;
}

function testByUUID(uuid){
  return (testList || []).find(x=>x?.test?.uuid===uuid)?.test;
}

function formatNextRun(test){
  if (!test.schedule_enabled || !test.next_run_at) return '';
  const t = new Date(test.next_run_at);
  const diff = t - Date.now();
  if (diff < 0) return 'due now';
  const mins = Math.round(diff / 60000);
  if (mins < 60) return `in ${mins} min`;
  const hrs = Math.round(mins / 60);
  return `in ${hrs} hr`;
}

function timeAgo(iso){
  const t = new Date(iso);
  const sec = Math.floor((Date.now() - t) / 1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min / 60);
  if (hr < 48) return `${hr} hr ago`;
  return t.toLocaleString();
}

function formatBytes(n){
  if (n == null || n === 0) return '0 B';
  if (n < 1024) return `${n} B`;
  return `${(n/1024).toFixed(1)} KB`;
}

function parseLogText(raw){
  return (raw||'').trim().split('\n').filter(Boolean).map(line=>{
    const m = line.match(/^(\S+)\s+\[(stdout|stderr)\]\s(.*)$/);
    if (!m) return {t:'', s:'stdout', l: line};
    return {t:m[1], s:m[2], l:m[3]};
  });
}

async function refreshTests(){
  const data = await apiJson('/tests');
  testList = Array.isArray(data) ? data : [];
}

async function go(view, a, b){
  state.view = view;
  state.testId = a ?? null;
  state.runId = b ?? null;
  const navView = view === 'test' || view === 'run' ? 'dashboard' : view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===navView));
  await render();
  window.scrollTo(0,0);
}

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="dot"></span><span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 3200);
}

async function pollJob(jobId){
  for (let i = 0; i < 120; i++){
    await sleep(1500);
    const j = await apiJson('/status/' + jobId);
    if (j.status === 'completed' || j.status === 'failed' || j.status === 'cancelled') return j;
  }
  throw new Error('timed out waiting for job');
}

function scheduleButton(uuid, sizeClass){
  const sm = sizeClass || 'btn-sm';
  const t = testByUUID(uuid);
  if (!t) return '';
  if (t.schedule_enabled){
    return `<button type="button" class="btn ${sm} btn-danger btn-icon btn-stop" title="Disable cron schedule" onclick="event.stopPropagation(); disableSchedule('${uuid}')">■ Stop</button>`;
  }
  if (!t.schedule_cron){
    return `<button type="button" class="btn ${sm} btn-ghost btn-icon" disabled title="Add a cron when uploading">▶ Play</button>`;
  }
  return `<button type="button" class="btn ${sm} btn-accent btn-icon btn-play" title="Enable cron schedule" onclick="event.stopPropagation(); enableSchedule('${uuid}')">▶ Play</button>`;
}

function actionButtons(uuid, sizeClass){
  const sm = sizeClass || 'btn-sm';
  return `<div class="btn-row" onclick="event.stopPropagation()">
    <button type="button" class="btn ${sm} btn-accent" onclick="runNow('${uuid}')">Run now</button>
    ${scheduleButton(uuid, sm)}
    <button type="button" class="btn ${sm} btn-danger" onclick="openDeleteModal('${uuid}')">Delete</button>
  </div>`;
}

async function enableSchedule(id){
  const name = testByUUID(id)?.name || id;
  try {
    await apiJson('/tests/' + id + '/schedule/start', { method: 'POST' });
    await refreshTests();
    toast(`Schedule <strong>on</strong> for ${esc(name)}`);
    if (state.view === 'dashboard') await renderDashboard();
    else if (state.view === 'test' && state.testId === id) await renderTestDetail(id);
  } catch (e) {
    toast(esc(e.message));
  }
}

async function disableSchedule(id){
  const name = testByUUID(id)?.name || id;
  try {
    await apiJson('/tests/' + id + '/schedule/stop', { method: 'POST' });
    await refreshTests();
    toast(`Schedule <strong>off</strong> for ${esc(name)}`);
    if (state.view === 'dashboard') await renderDashboard();
    else if (state.view === 'test' && state.testId === id) await renderTestDetail(id);
  } catch (e) {
    toast(esc(e.message));
  }
}

async function runNow(id){
  const item = testList.find(x=>x.test.uuid===id);
  const name = item ? item.test.name : id;
  toast(`Manual run for <strong>${esc(name)}</strong>…`);
  try {
    const res = await apiJson('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ testId: id }),
    });
    const job = await pollJob(res.job_id);
    await refreshTests();
    const st = lastStatus(testList.find(x=>x.test.uuid===id) || {last_run:null});
    toast(`<strong>${esc(name)}</strong> · ${esc(job.status)} · run ${esc(st)}`);
    if (state.view === 'dashboard') await renderDashboard();
    else if (state.view === 'test' && state.testId === id) await renderTestDetail(id);
  } catch (e) {
    toast(esc(e.message));
  }
}

async function renderDashboard(){
  document.getElementById('main').innerHTML = '<div class="empty">Loading monitors…</div>';
  await refreshTests();
  const total = testList.length;
  const passing = testList.filter(t=>lastStatus(t)==='pass').length;
  const failing = testList.filter(t=>lastStatus(t)==='fail').length;

  const rows = testList.map(item=>{
    const t = item.test;
    const st = lastStatus(item);
    const lr = item.last_run;
    const next = formatNextRun(t);
    const sched = scheduleLabel(t);
    return `
    <tr class="clickable" onclick="go('test','${t.uuid}')">
      <td>${statusPill(st)}</td>
      <td><div class="tname">${esc(t.name)}</div><div class="tid mono">${shortId(t.uuid)}</div></td>
      <td>${runtimeBadge(t.runtime)}</td>
      <td>${sevPill(t.severity)}</td>
      <td class="mono">${esc(sched)}${next ? `<div class="tid">next ${esc(next)}</div>` : ''}</td>
      <td>${lr ? `${timeAgo(lr.started_at)}<div class="tid">${lr.duration_ms} ms</div>` : '—'}</td>
      <td class="tid">${alertLabel(t)}</td>
      <td style="text-align:right">${actionButtons(t.uuid)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" class="empty">No tests yet — upload your first binary.</td></tr>`;

  document.getElementById('main').innerHTML = `
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <p class="sub">Production monitors built from your own test binaries.</p>
      </div>
      <button class="btn btn-accent" onclick="go('upload')">+ Upload test</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">monitors</div></div>
      <div class="stat ok"><div class="stat-n">${passing}</div><div class="stat-l">passing</div></div>
      <div class="stat bad"><div class="stat-n">${failing}</div><div class="stat-l">failing</div></div>
      <div class="stat warn"><div class="stat-n">${alertsConfiguredCount()}</div><div class="stat-l">webhooks configured</div></div>
    </div>
    <div class="panel"><div class="twrap"><table>
      <thead><tr><th>Status</th><th>Test</th><th>Runtime</th><th>Severity</th><th>Schedule</th><th>Last run</th><th>Alerts</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

async function renderTestDetail(id){
  document.getElementById('main').innerHTML = '<div class="empty">Loading test…</div>';
  await refreshTests();
  const t = await apiJson('/tests/' + id);
  const runsRaw = await apiJson('/tests/' + id + '/runs');
  const runs = Array.isArray(runsRaw) ? runsRaw : [];
  const listItem = (testList || []).find(x=>x.test.uuid===id);
  const st = listItem ? lastStatus(listItem) : (runs[0] ? runs[0].status : 'pending');

  const runRows = runs.map(r=>`
    <tr class="clickable" onclick="go('run','${id}','${r.uuid}')">
      <td>${statusPill(r.status)}</td>
      <td class="mono">${esc(r.started_at)}</td>
      <td class="mono">${r.duration_ms} ms</td>
      <td class="mono">${formatBytes(r.log_size_bytes)}</td>
    </tr>`).join('') || `<tr><td colspan="4" class="empty">No runs yet — hit Run now or wait for the schedule.</td></tr>`;

  const cmd = t.command ? esc(t.command) : '<span class="tid">runtime default</span>';
  const th = t.failure_threshold || 3;
  const alertsOn = t.alerts_enabled !== false;
  const nextFire = t.consecutive_failures > 0
    ? (Math.floor(t.consecutive_failures / th) + 1) * th
    : th;
  const alertState = !alertsOn
    ? 'Webhooks paused (failure streak still tracked)'
    : t.consecutive_failures === 0
      ? `Active · first alert after ${th} consecutive failures, then every ${th}`
      : t.consecutive_failures >= th
        ? `${t.consecutive_failures} consecutive · next webhook at ${nextFire} failures`
        : `${t.consecutive_failures}/${th} toward first webhook`;

  document.getElementById('main').innerHTML = `
    <div class="crumbs"><button onclick="go('dashboard')">Dashboard</button><span class="sep">/</span><span class="cur">${esc(t.name)}</span></div>
    <div class="page-head">
      <div>
        <h1>${esc(t.name)}</h1>
        <p class="sub">${statusPill(st)} &nbsp;·&nbsp; ${sevPill(t.severity)} &nbsp;·&nbsp; ${runtimeBadge(t.runtime)}</p>
      </div>
      <div class="btn-row">${actionButtons(t.uuid, '')}</div>
    </div>
    <div class="panel">
      <div class="kv-strip">
        <div><span class="kv-k">Test ID</span><span class="kv-v">${t.uuid}</span></div>
        <div><span class="kv-k">Schedule</span><span class="kv-v">${esc(scheduleLabel(t))}</span></div>
        <div><span class="kv-k">Cron enabled</span><span class="kv-v">${t.schedule_enabled ? 'yes' : 'no'}</span></div>
        <div><span class="kv-k">Command</span><span class="kv-v">${cmd}</span></div>
        <div><span class="kv-k">Timeout</span><span class="kv-v">${t.timeout_seconds}s</span></div>
        <div><span class="kv-k">Alert state</span><span class="kv-v">${esc(alertState)}</span></div>
      </div>
    </div>
    <div class="section-title">Alerts</div>
    <form class="panel" style="padding:1.25rem 1.5rem" onsubmit="saveAlerts(event,'${id}')">
      <div class="form-grid">
        <div class="field full">
          <label for="webhook-url">Slack / webhook URL</label>
          <input id="webhook-url" type="url" placeholder="https://hooks.slack.com/services/…" value="${esc(t.webhook_url||'')}">
          <span class="hint">Slack incoming webhook or any URL that accepts JSON <code>{"text":"…"}</code>.</span>
        </div>
        <div class="field">
          <label for="fail-th">Consecutive failures before alert</label>
          <input id="fail-th" type="number" min="1" value="${th}">
          <span class="hint">Webhook at ${th}, ${th*2}, ${th*3}… consecutive failures (recovery on pass).</span>
        </div>
        <div class="field full">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;font-weight:500">
            <input type="checkbox" id="alerts-enabled" ${alertsOn ? 'checked' : ''} style="width:auto">
            Send webhook alerts
          </label>
          <span class="hint">Turn off to pause delivery without losing the failure counter.</span>
        </div>
      </div>
      <div style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap">
        <button type="submit" class="btn btn-accent">Save alert settings</button>
        <button type="button" class="btn ${alertsOn ? 'btn-ghost' : 'btn-accent'}" onclick="toggleAlertsPause('${id}', ${alertsOn})">${alertsOn ? 'Pause webhooks now' : 'Resume webhooks'}</button>
      </div>
    </form>
    <div class="section-title">Run history</div>
    <div class="panel"><div class="twrap"><table>
      <thead><tr><th>Status</th><th>Started</th><th>Duration</th><th>Log size</th></tr></thead>
      <tbody>${runRows}</tbody>
    </table></div></div>`;
}

async function renderRunDetail(testId, runId){
  document.getElementById('main').innerHTML = '<div class="empty">Loading log…</div>';
  const t = await apiJson('/tests/' + testId);
  const runsRaw = await apiJson('/tests/' + testId + '/runs');
  const runs = Array.isArray(runsRaw) ? runsRaw : [];
  const r = runs.find(x=>x.uuid===runId);
  if (!r){
    document.getElementById('main').innerHTML = '<div class="empty">Run not found.</div>';
    return;
  }
  const raw = await fetch('/runs/' + runId + '/log').then(res=>{
    if (!res.ok) throw new Error('failed to load log');
    return res.text();
  });
  const logLines = parseLogText(raw).map(x=>`<div class="log-line"><span class="log-t">${esc(x.t)}</span> <span class="log-stdout">[${x.s}]</span> <span class="${x.s==='stderr'?'log-stderr':'log-stdout'}">${esc(x.l)}</span></div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="crumbs"><button onclick="go('dashboard')">Dashboard</button><span class="sep">/</span><button onclick="go('test','${testId}')">${esc(t.name)}</button><span class="sep">/</span><span class="cur">run</span></div>
    <div class="page-head">
      <div>
        <h1>Run detail</h1>
        <p class="sub">${statusPill(r.status)} &nbsp;·&nbsp; started ${esc(r.started_at)} &nbsp;·&nbsp; ${r.duration_ms} ms &nbsp;·&nbsp; ${formatBytes(r.log_size_bytes)}</p>
      </div>
    </div>
    <div class="term">
      <div class="term-bar"><span class="term-dot" style="background:#ff5f57"></span><span class="term-dot" style="background:#ffbd2e"></span><span class="term-dot" style="background:#28c840"></span><span>stdout + stderr · ${esc(t.name)}</span></div>
      <div class="term-body">${logLines || '<span class="log-t">(empty log)</span>'}</div>
    </div>`;
}

function bindDropzone(){
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('file-input');
  const label = document.getElementById('file-label');
  if (!dz || !input) return;
  dz.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{
    const f = input.files[0];
    label.textContent = f ? f.name : 'Drop a binary or browse…';
  });
}

function renderUpload(){
  document.getElementById('main').innerHTML = `
    <div class="crumbs"><button onclick="go('dashboard')">Dashboard</button><span class="sep">/</span><span class="cur">Upload test</span></div>
    <h1>Upload a test</h1>
    <p class="sub">Upload an artifact and pick a runtime — BYOT runs it in Docker on demand or on a cron.</p>
    <form class="panel" style="padding:1.5rem 1.75rem" onsubmit="submitUpload(event)">
      <div class="form-grid">
        <div class="field full">
          <label for="test-name">Monitor name</label>
          <input id="test-name" type="text" placeholder="e.g. checkout-flow, api-smoke" required maxlength="120">
          <span class="hint">Shown in the dashboard — not the file name on disk.</span>
        </div>
        <div class="field full">
          <label>Test binary</label>
          <div class="dropzone" id="dropzone"><span id="file-label">Drop a binary or <strong>browse…</strong></span></div>
          <input type="file" id="file-input" hidden>
        </div>
        <div class="field">
          <label for="rt">Runtime</label>
          <select id="rt"><option value="go">go</option><option value="node">node</option><option value="k6">k6</option></select>
        </div>
        <div class="field">
          <label for="sev">Severity</label>
          <select id="sev"><option value="P0">P0</option><option value="P1">P1</option><option value="P2" selected>P2</option><option value="P3">P3</option></select>
        </div>
        <div class="field">
          <label for="command">Command (optional)</label>
          <input id="command" placeholder="./artifact or node ./artifact">
          <span class="hint">Leave empty to use the runtime default.</span>
        </div>
        <div class="field">
          <label for="timeout">Timeout (seconds)</label>
          <input id="timeout" type="number" value="30" min="1">
        </div>
        <div class="field full">
          <label for="cron">Schedule (cron, optional)</label>
          <input id="cron" placeholder="leave empty to run manually only">
          <div class="chips">
            <span class="chip" onclick="document.getElementById('cron').value='*/5 * * * *'">every 5 min</span>
            <span class="chip" onclick="document.getElementById('cron').value='*/15 * * * *'">every 15 min</span>
            <span class="chip" onclick="document.getElementById('cron').value='0 * * * *'">hourly</span>
          </div>
        </div>
        <div class="field full">
          <label for="webhook">Slack / webhook URL (optional)</label>
          <input id="webhook" type="url" placeholder="https://hooks.slack.com/services/…">
        </div>
        <div class="field">
          <label for="fail-th-upload">Failures before alert</label>
          <input id="fail-th-upload" type="number" min="1" value="3">
          <span class="hint">Alert on the 3rd consecutive failure by default.</span>
        </div>
      </div>
      <div style="margin-top:1.5rem;display:flex;gap:.6rem">
        <button type="submit" class="btn btn-accent" id="upload-btn">Upload &amp; create monitor</button>
        <button type="button" class="btn btn-ghost" onclick="go('dashboard')">Cancel</button>
      </div>
    </form>`;
  bindDropzone();
}

async function submitUpload(e){
  e.preventDefault();
  const input = document.getElementById('file-input');
  const file = input.files[0];
  if (!file){ toast('Choose a binary file first'); return; }
  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  const displayName = document.getElementById('test-name').value.trim();
  if (!displayName){ toast('Enter a monitor name'); return; }
  const fd = new FormData();
  fd.append('name', displayName);
  fd.append('binary', file);
  fd.append('runtime', document.getElementById('rt').value);
  fd.append('severity', document.getElementById('sev').value);
  fd.append('timeout', document.getElementById('timeout').value);
  const cmd = document.getElementById('command').value.trim();
  if (cmd) fd.append('command', cmd);
  const cron = document.getElementById('cron').value.trim();
  if (cron) fd.append('cron', cron);
  const webhook = document.getElementById('webhook').value.trim();
  if (webhook) fd.append('webhook_url', webhook);
  fd.append('failure_threshold', document.getElementById('fail-th-upload').value);
  try {
    const res = await apiJson('/uploadBinary', { method: 'POST', body: fd });
    toast(`<strong>${esc(displayName)}</strong> uploaded`);
    await go('test', res.id);
  } catch (err) {
    toast(esc(err.message));
    btn.disabled = false;
  }
}

async function saveAlerts(e, testId){
  e.preventDefault();
  const webhook = document.getElementById('webhook-url').value.trim();
  const th = parseInt(document.getElementById('fail-th').value, 10);
  const alertsEnabled = document.getElementById('alerts-enabled').checked;
  if (!th || th < 1){ toast('Failure threshold must be at least 1'); return; }
  try {
    await apiJson('/tests/' + testId + '/config', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        webhook_url: webhook,
        failure_threshold: th,
        alerts_enabled: alertsEnabled,
      }),
    });
    toast('Alert settings saved');
    await renderTestDetail(testId);
  } catch (err) {
    toast(esc(err.message));
  }
}

async function toggleAlertsPause(testId, currentlyEnabled){
  try {
    await apiJson('/tests/' + testId + '/config', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ alerts_enabled: !currentlyEnabled }),
    });
    toast(currentlyEnabled ? 'Webhook alerts paused' : 'Webhook alerts resumed');
    await renderTestDetail(testId);
  } catch (err) {
    toast(esc(err.message));
  }
}

function closeDeleteModal(){
  document.getElementById('delete-modal-root')?.remove();
}

function openDeleteModal(testId){
  closeDeleteModal();
  const item = testList.find(x=>x.test.uuid===testId);
  const name = item?.test?.name || testId;
  const root = document.createElement('div');
  root.id = 'delete-modal-root';
  root.className = 'modal-overlay';
  root.innerHTML = `
    <div class="modal" role="dialog" aria-labelledby="delete-modal-title" onclick="event.stopPropagation()">
      <h2 id="delete-modal-title">Delete monitor?</h2>
      <p>This removes <strong>${esc(name)}</strong>, its uploaded artifact, all run logs in storage, and job history. This cannot be undone.</p>
      <div class="field">
        <label for="delete-confirm-input">Type <span class="mono">delete</span> to confirm</label>
        <input id="delete-confirm-input" type="text" autocomplete="off" placeholder="delete">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm-btn" disabled onclick="confirmDeleteMonitor('${testId}')">Delete permanently</button>
      </div>
    </div>`;
  root.addEventListener('click', closeDeleteModal);
  document.body.appendChild(root);
  const input = document.getElementById('delete-confirm-input');
  const btn = document.getElementById('delete-confirm-btn');
  input.focus();
  input.addEventListener('input', ()=>{
    btn.disabled = input.value.trim() !== 'delete';
  });
  input.addEventListener('keydown', e=>{
    if (e.key === 'Enter' && !btn.disabled) confirmDeleteMonitor(testId);
    if (e.key === 'Escape') closeDeleteModal();
  });
}

async function confirmDeleteMonitor(testId){
  const input = document.getElementById('delete-confirm-input');
  if (!input || input.value.trim() !== 'delete') return;
  const btn = document.getElementById('delete-confirm-btn');
  if (btn) btn.disabled = true;
  try {
    await apiJson('/tests/' + testId, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: 'delete' }),
    });
    closeDeleteModal();
    toast('Monitor deleted');
    if (state.view === 'test' && state.testId === testId) {
      await go('dashboard');
    } else {
      await refreshTests();
      if (state.view === 'dashboard') await renderDashboard();
    }
  } catch (err) {
    toast(esc(err.message));
    if (btn) btn.disabled = false;
  }
}

async function render(){
  try {
    if (state.view === 'dashboard') await renderDashboard();
    else if (state.view === 'upload') renderUpload();
    else if (state.view === 'test') await renderTestDetail(state.testId);
    else if (state.view === 'run') await renderRunDetail(state.testId, state.runId);
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    toast(esc(e.message));
  }
}
render();
</script>
