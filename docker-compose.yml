# Full stack:        docker compose up -d          → http://localhost:3000/app
# Build from source: docker compose up -d --build
# Contributors:      docker compose up -d postgres minio, then `go run .`

services:

  byot:
    image: ghcr.io/alexanderritik/byot:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=byot
      - DB_URL=postgres://fnx:fnx@postgres:5432/fnx?sslmode=disable
      # Must match the bind mount below (same path on host and container).
      - WORKSPACE_DIR=/tmp/byot-runs
      - SECRETS_KEY=${SECRETS_KEY:-}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
    volumes:
      # Tests run as sibling containers on the host's docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # The daemon mounts run workspaces by host path, so the path must be
      # identical inside and outside this container.
      - /tmp/byot-runs:/tmp/byot-runs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fnx
      - POSTGRES_PASSWORD=fnx
      - POSTGRES_DB=fnx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnx -d fnx"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  minio_data:
  postgres_data:
